<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- One policy shared by every page: a single list is far less likely to
     silently break than four drifting ones. Origins in use: Google Fonts,
     gtag.js, Wistia (video), Tally (UGC form), ipapi.co (language). Must stay
     above the first resource tag — anything before it is not covered.
     frame-ancestors cannot be set from a meta tag, so clickjacking defence
     would need a real HTTP header, which GitHub Pages cannot send. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src https://fast.wistia.net https://tally.so; script-src 'self' https://www.googletagmanager.com https://connect.facebook.net https://tally.so; connect-src 'self' https://ipapi.co https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com; img-src 'self' data: https://*.google-analytics.com https://www.facebook.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>404 · AdsMerce</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=6">
</head>

</header>

    </div>

</footer>

<script src="/js/main.js?v=6"></script>
</body>
</html>
